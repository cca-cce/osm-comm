<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 800px; overflow: hidden; }
body { background: #18181f; }
.slide { width: 1200px; height: 800px; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; }

  /* ── Shared slide styles ─────────────────────────────── */
  .slide {
    background: #18181f;
    color: #fff;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 80px 100px 70px 100px;
    position: relative;
  }

  /* ── Title slide ─────────────────────────────────────── */
  .slide-title {
    justify-content: center;
  }
  .slide-title .main-title {
    font-size: 68px;
    font-weight: 700;
    line-height: 1.15;
    max-width: 900px;
    margin-bottom: 56px;
  }
  .slide-title .subtitle {
    font-size: 34px;
    color: rgba(255,255,255,0.72);
    margin-bottom: 20px;
  }
  .slide-title .authors {
    font-size: 32px;
    color: rgba(255,255,255,0.55);
  }

  /* ── Section header slides ───────────────────────────── */
  .slide-section {
    background: #111118;
    justify-content: center;
  }
  .slide-section .sec-num {
    font-size: 120px;
    font-weight: 700;
    color: rgba(255,255,255,0.07);
    line-height: 1;
    margin-bottom: 24px;
  }
  .slide-section .sec-label {
    font-size: 28px;
    color: #d4821e;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .slide-section .sec-title {
    font-size: 64px;
    font-weight: 700;
    line-height: 1.18;
    max-width: 860px;
  }

  /* ── Content slides (two-column) ─────────────────────── */
  .slide-content .slide-heading {
    font-size: 52px;
    font-weight: 700;
    line-height: 1.18;
    margin-bottom: 52px;
    text-wrap: pretty;
  }
  .slide-content .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 72px;
    flex: 1;
    align-items: center;
  }
  .viz-col {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide-content .bullet-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .slide-content .bullet-list li {
    display: flex;
    align-items: flex-start;
    gap: 18px;
    font-size: 30px;
    line-height: 1.45;
    color: rgba(255,255,255,0.88);
  }
  .slide-content .bullet-list li::before {
    content: "•";
    color: rgba(255,255,255,0.4);
    flex-shrink: 0;
    margin-top: 2px;
  }
  .slide-content .bullet-list li.accent {
    color: #d4821e;
    font-weight: 600;
  }
  .slide-content .bullet-list li.accent::before {
    color: #d4821e;
  }

  /* ── Image placeholder ───────────────────────────────── */
  .img-placeholder {
    width: 100%;
    aspect-ratio: 4/3;
    background: repeating-linear-gradient(
      45deg,
      rgba(255,255,255,0.03) 0px,
      rgba(255,255,255,0.03) 1px,
      transparent 1px,
      transparent 12px
    );
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 32px;
    text-align: center;
  }
  .img-placeholder .img-icon {
    opacity: 0.18;
    font-size: 48px;
  }
  .img-placeholder .img-label {
    font-family: 'Courier New', Courier, monospace;
    font-size: 24px;
    color: rgba(255,255,255,0.35);
    line-height: 1.5;
    letter-spacing: 0.02em;
  }

  /* ── Footer ──────────────────────────────────────────── */
  .footer {
    position: absolute;
    bottom: 28px;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 100px;
  }
  .footer .footer-url {
    font-size: 24px;
    color: #5ba4cf;
  }
  .footer .footer-logo {
    font-size: 24px;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .footer .footer-logo::before {
    content: "";
    display: inline-block;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
  }

</style></head><body><div class="slide slide-section">
      <div class="sec-num">02</div>
      <div class="sec-label">Section Two</div>
      <div class="sec-title">Advertising Psychology</div>
      <div class="footer">
    <span class="footer-url">canvas.education.lu.se/courses/37906</span>
    <span class="footer-logo">Lund University</span>
  </div>
    </div></body></html>
